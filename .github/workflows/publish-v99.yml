name: Publish Equicord v99
on:
  push:
    branches: [main]
    paths: [release-v99-parts/part-000]
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Reassemble and verify files
        run: python3 release-v99-rebuild.py
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create equicord-v25-99 release-v99/desktop.asar release-v99/desktop.sha256 release-v99/Mc5mr-Equicord-Installer.exe release-v99/Mc5mr-Equicord-Installer.exe.sha256 release-v99/Equicord-v99-source.tar.gz release-v99/AFKPanel-local-service.zip --title 'Mc5mr Equicord v25-99' --notes 'Adds experimental AFK Panel with a separate local companion, Clonecord and PlatformSpoofer; updates local CopyProfile views. Build and simulated tests passed, not tested with live Discord accounts. Self-bot use can lead to account restrictions. Camera and share controls are markers, not video streams.' --latest
      - name: Activate updater
        run: |
          set -euo pipefail
          cp release-v99-feed.json latest.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add latest.json
          git commit -m 'Activate v99 updater feed'
          git push
