name: Custom plugin checks
on:
  pull_request:
    paths:
      - src/api/Badges.ts
      - src/assets/badges/**
      - src/userplugins/**
      - scripts/verify*.mjs
      - scripts/verify*.py
      - scripts/buildStereoHub.mjs
      - scripts/packagePrivateBuild.mjs
      - tools/ProdHallowStereo/**
      - .github/workflows/plugin-checks.yml
permissions:
  contents: read
jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.13'
      - run: npm install --global pnpm@12.8.1
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec tsc --noEmit
      - run: python scripts/verifyProdHallowStereo.py
      - run: node scripts/verifyProdHallowStereo.mjs
      - run: node scripts/verifyReadAllDMs.mjs
      - run: node scripts/verifyPluginLifecycle.mjs
      - run: node scripts/verifyMc5mrUpdates.mjs
      - run: node scripts/verifyStockPlugins.mjs
      - run: node scripts/verifyFakeFriends.mjs
      - run: node scripts/verifyCustomPlugins.mjs
      - run: node scripts/verifyExternalPlugins.mjs
      - run: node scripts/verifyModalCompatibility.mjs
      - run: node scripts/verifyBundledUserPlugins.mjs
      - run: pnpm buildStandalone --disable-updater
      - run: python -m pip install pyinstaller==6.16.0
      - run: node scripts/buildStereoHub.mjs
      - run: node scripts/packagePrivateBuild.mjs
