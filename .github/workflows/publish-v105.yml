name: Publish Equicord v105
on:
  push:
    branches: [main]
    paths: [release-v105-parts/part-000]
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Reassemble and verify files
        run: python3 release-v105-rebuild.py
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create equicord-v25-105 release-v105/desktop.asar release-v105/desktop.sha256 release-v105/Mc5mr-Equicord-Installer.exe release-v105/Mc5mr-Equicord-Installer.exe.sha256 release-v105/Equicord-v105-source.tar.gz --title 'Mc5mr Equicord v25-105' --notes 'Adds VirusTotal scanning with an encrypted user API key, green voice-join notices, and context-menu group labels. Includes Clonecord 1.4.1. Build and automated tests passed; live Discord and VirusTotal testing have not been performed.' --latest
