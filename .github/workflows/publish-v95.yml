name: Publish Equicord v95
on:
  push:
    branches: [main]
    paths: [release-v95-parts/part-000]
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Reassemble and verify files
        run: python3 release-v95-rebuild.py
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create equicord-v25-95 release-v95/desktop.asar release-v95/desktop.sha256 release-v95/Mc5mr-Equicord-Installer.exe release-v95/Mc5mr-Equicord-Installer.exe.sha256 --title 'Mc5mr Equicord v25-95' --notes 'Displays Mc5mr as the author in the plugin settings footer. Upstream authors and license notices remain in the source and package. Build passed; live Discord compatibility has not been verified.' --latest
      - name: Activate updater
        run: |
          set -euo pipefail
          cp release-v95-feed.json latest.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add latest.json
          git commit -m 'Activate v95 updater feed'
          git push
