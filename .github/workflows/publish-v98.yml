name: Publish Equicord v98
on:
  push:
    branches: [main]
    paths: [release-v98-parts/part-000]
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Reassemble and verify files
        run: python3 release-v98-rebuild.py
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create equicord-v25-98 release-v98/desktop.asar release-v98/desktop.sha256 release-v98/Mc5mr-Equicord-Installer.exe release-v98/Mc5mr-Equicord-Installer.exe.sha256 --title 'Mc5mr Equicord v25-98' --notes 'Adds AlwaysShowForwardTime and recovery from an unexpected stereo worker exit while Discord remains open. Build and targeted tests passed; Discord runtime has not been tested live. Other Moonlight and Replugged plugins remain unported.' --latest
      - name: Activate updater
        run: |
          set -euo pipefail
          cp release-v98-feed.json latest.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add latest.json
          git commit -m 'Activate v98 updater feed'
          git push
