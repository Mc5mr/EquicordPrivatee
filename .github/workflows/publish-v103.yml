name: Publish Equicord v103
on:
  push:
    branches: [main]
    paths: [release-v103-parts/part-000]
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Reassemble and verify files
        run: python3 release-v103-rebuild.py
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create equicord-v25-103 release-v103/desktop.asar release-v103/desktop.sha256 release-v103/Mc5mr-Equicord-Installer.exe release-v103/Mc5mr-Equicord-Installer.exe.sha256 release-v103/Equicord-v103-source.tar.gz --title 'Mc5mr Equicord v25-103' --notes 'Adds optional FullscreenToggle (Alt+Shift+F) in User Plugins. Install with the installer. Build and automated checks passed; live Discord testing has not been performed.' --latest
