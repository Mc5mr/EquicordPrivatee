name: Publish Equicord v90
on:
  push:
    branches: [main]
    paths: [release-v90-parts/part-000]
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Reassemble and verify files
        run: python3 release-v90-rebuild.py
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create equicord-v25-90 release-v90/desktop.asar release-v90/desktop.sha256 release-v90/Mc5mr-Equicord-Installer.exe release-v90/Mc5mr-Equicord-Installer.exe.sha256 --title 'Mc5mr Equicord v25-90' --notes 'Fixes oversized microphone and screenshare settings icons and moves the 31 newly added plugins into UserPlugins. Automated build and installer tests passed; live Discord compatibility is not yet verified.' --latest
      - name: Activate updater
        run: |
          set -euo pipefail
          cp release-v90-feed.json latest.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add latest.json
          git commit -m 'Activate v90 updater feed'
          git push
