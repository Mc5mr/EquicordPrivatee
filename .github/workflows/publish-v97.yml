name: Publish Equicord v97
on:
  push:
    branches: [main]
    paths: [release-v97-parts/part-000]
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Reassemble and verify files
        run: python3 release-v97-rebuild.py
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create equicord-v25-97 release-v97/desktop.asar release-v97/desktop.sha256 release-v97/Mc5mr-Equicord-Installer.exe release-v97/Mc5mr-Equicord-Installer.exe.sha256 --title 'Mc5mr Equicord v25-97' --notes 'Equicord updates, Nightcord FakeSwitcher, author display and voice rule improvements. Build and targeted tests passed; Discord runtime has not been tested live.' --latest
      - name: Activate updater
        run: |
          set -euo pipefail
          cp release-v97-feed.json latest.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add latest.json
          git commit -m 'Activate v97 updater feed'
          git push
