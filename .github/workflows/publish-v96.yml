name: Publish Equicord v96
on:
  push:
    branches: [main]
    paths: [release-v96-parts/part-000]
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Reassemble and verify files
        run: python3 release-v96-rebuild.py
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create equicord-v25-96 release-v96/desktop.asar release-v96/desktop.sha256 release-v96/Mc5mr-Equicord-Installer.exe release-v96/Mc5mr-Equicord-Installer.exe.sha256 --title 'Mc5mr Equicord v25-96' --notes 'Adds CallIdling and JumpToBlocked inspired by Moonlight. Build and type checks passed; the Discord client patches have not been tested live.' --latest
      - name: Activate updater
        run: |
          set -euo pipefail
          cp release-v96-feed.json latest.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add latest.json
          git commit -m 'Activate v96 updater feed'
          git push
