name: Publish Equicord v106
on:
  push:
    branches: [main]
    paths: [release-v106-parts/part-000]
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Reassemble and verify files
        run: python3 release-v106-rebuild.py
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create equicord-v25-106 release-v106/desktop.asar release-v106/desktop.sha256 release-v106/Mc5mr-Equicord-Installer.exe release-v106/Mc5mr-Equicord-Installer.exe.sha256 release-v106/Equicord-v106-source.tar.gz --title 'Mc5mr Equicord v25-106' --notes 'Restores the wider cloner interface, lists administrator servers and guards empty channel selections. Build and automated checks passed; live Discord cloning has not been performed.' --latest
