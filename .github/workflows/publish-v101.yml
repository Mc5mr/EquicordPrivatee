name: Publish Equicord v101
on:
  push:
    branches: [main]
    paths: [release-v101-parts/part-000]
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Reassemble and verify files
        run: python3 release-v101-rebuild.py
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create equicord-v25-101 release-v101/desktop.asar release-v101/desktop.sha256 release-v101/Mc5mr-Equicord-Installer.exe release-v101/Mc5mr-Equicord-Installer.exe.sha256 release-v101/Equicord-v101-source.tar.gz --title 'Mc5mr Equicord v25-101' --notes 'Removes AFK Panel and adds HideAkaBadge, DMHeaderMenu, HideDMSidebar, HideSidebarTabs and SlimChatInput. Build and type checks passed; live Discord testing has not been performed.' --latest
      - name: Activate updater
        run: |
          set -euo pipefail
          cp release-v101-feed.json latest.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add latest.json
          git commit -m 'Activate v101 updater feed'
          git push
