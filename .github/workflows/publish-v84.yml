name: Publish Equicord v84
on:
  push:
    branches: [main]
    paths: [release-v84/latest.json]
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Verify and publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 release-v84/verify.py
          gh release create equicord-v25-84 release-v84/desktop.asar release-v84/desktop.sha256 release-v84/Mc5mr-Equicord-Installer.exe release-v84/Mc5mr-Equicord-Installer.exe.sha256 --title 'Mc5mr Equicord v25-84' --notes 'Updates UserRadar, improves Discord startup compatibility and makes QuestSpoofer selectable.' --latest
      - name: Activate updater
        run: |
          set -euo pipefail
          cp release-v84/latest.json latest.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add latest.json
          git commit -m 'Activate v84 updater feed'
          git push
